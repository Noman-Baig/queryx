name: queryx
description: >
  Fast, lightweight server-state engine for Dart & Flutter — caching, deduplication, retry, pagination, mutations, and offline sync. Works with any state manager.
version: 0.1.2
license: MIT
homepage: https://github.com/Noman-Baig
repository: https://github.com/Noman-Baig/queryx
issue_tracker: https://github.com/Noman-Baig/queryx/issues
documentation: https://github.com/Noman-Baig/queryx#readme

environment:
  sdk: ">=3.3.0 <4.0.0"

# NOTE: the core package is intentionally pure Dart. It has zero dependency on
# Flutter or Dio. Transport, persistence, and UI-binding are all adapters that
# live in separate sibling packages (queryx_dio, queryx_riverpod, queryx_getx,
# queryx_persistence) so apps only pull in what they actually use.
dependencies:
  meta: ^1.15.0

dev_dependencies:
  test: ^1.25.0
  lints: ^5.1.1

topics:
  - networking
  - caching
  - state-management
  - api
  - offline
